<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kabbu Scorekeeper</title><style>:root{--bg:#f6f5f1;--card:#fffefa;--ink:#24231f;--muted:#716f68;--line:#ddd9d1;--accent:#006b70;--lead:#3d7924;--danger:#9f286f;font-family:system-ui,sans-serif}*{box-sizing:border-box;margin:0}body{min-height:100dvh;background:var(--bg);color:var(--ink)}button,input{font:inherit;color:inherit}.app{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.top h1{font-size:1.65rem}.top p{margin-top:4px;font-size:.9rem;color:var(--muted)}.controls{display:flex;gap:8px}.btn{border:0;border-radius:8px;min-height:42px;padding:9px 14px;cursor:pointer;font-weight:700;background:#e9e6df}.save{background:var(--accent);color:#fff}.reset{color:var(--danger)}.scoreboard,.history{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.player{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.player label{display:block;margin-bottom:6px;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}.name{width:100%;border:0;border-bottom:1px solid var(--line);padding:5px 1px 7px;background:transparent;font-weight:700;outline:none}.score{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px 6px;background:#fcfcfa;text-align:center;font-size:1.8rem;font-weight:700;outline:none}.score:focus,.name:focus{border-color:var(--accent)}.total{margin-top:12px;border-radius:8px;padding:9px;background:#f4f2ed}.leading{outline:1px solid var(--lead)}.total span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}.total strong{display:block;margin-top:2px;font-size:1.55rem;font-variant-numeric:tabular-nums}.leading strong{color:var(--lead)}.meta{display:flex;justify-content:space-between;gap:12px;margin-top:13px;font-size:.85rem;color:var(--muted)}.history{margin-top:14px;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history strong{color:var(--ink);margin-right:10px}@media(max-width:700px){.app{padding:10px}.top{align-items:flex-start;flex-direction:column}.players{gap:6px}.player{padding:7px}.name{font-size:.8rem}.score{margin-top:8px;padding:10px 3px;font-size:1.25rem}.total{margin-top:8px;padding:7px}.total strong{font-size:1.2rem}.player label{font-size:.62rem}.controls{width:100%}.btn{flex:1;padding:8px}.scoreboard{padding:7px}}</style></head><body><main class="app"><header class="top"><div><h1>Kabbu scorekeeper</h1><p>Enter each round’s score and save. Negative scores are supported.</p></div><div class="controls"><button class="btn save" id="save">Save round</button><button class="btn reset" id="reset">Reset</button></div></header><section class="scoreboard"><div class="players" id="players"></div><div class="meta"><span id="roundLabel">Round 1</span><span>Lowest total is leading</span></div></section><section class="history"><strong>Recent rounds</strong><span id="historyText">No rounds saved yet.</span></section></main><script>const playerData=[{name:'Player 1'},{name:'Player 2'},{name:'Player 3'},{name:'Player 4'}];const state={round:1,totals:[0,0,0,0],history:[]};const playersEl=document.querySelector('#players');function render(){const lowest=Math.min(...state.totals);playersEl.innerHTML=playerData.map((player,index)=>`<article class="player"><label for="name-${index}">Player ${index+1}</label><input class="name" id="name-${index}" value="${player.name}"><label for="score-${index}" style="margin-top:12px">This round</label><input class="score" id="score-${index}" type="number" step="1" inputmode="decimal" value="0"><div class="total ${state.totals[index]===lowest?'leading':''}"><span>Running total</span><strong>${state.totals[index]}</strong></div></article>`).join('')}function saveRound(){const scores=[];playerData.forEach((player,index)=>{player.name=document.querySelector('#name-'+index).value.trim()||`Player ${index+1}`;scores[index]=Number(document.querySelector('#score-'+index).value||0);state.totals[index]+=scores[index]});state.history.unshift(`Round ${state.round}: ${scores.join(' · ')}`);state.history=state.history.slice(0,8);state.round++;document.querySelector('#roundLabel').textContent=`Round ${state.round}`;document.querySelector('#historyText').textContent=state.history.join('  |  ');render()}function resetGame(){state.round=1;state.totals=[0,0,0,0];state.history=[];document.querySelector('#roundLabel').textContent='Round 1';document.querySelector('#historyText').textContent='No rounds saved yet.';render()}document.querySelector('#save').addEventListener('click',saveRound);document.querySelector('#reset').addEventListener('click',resetGame);render();</script></body></html>
